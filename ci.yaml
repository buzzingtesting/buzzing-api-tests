market_cases:
  # market_list：排序、分类和详情。市场 ID、分页游标和电竞联赛从本轮响应获取。
  home_list:
    page_size: 30
    sort_modes:
      top_picks: Top Picks
      newest: Newest
      liquidity: Liquidity
      volume: Volume
      24hr_volume: 24hr Volume
      end_soon: End Soon

  nba_limit_buy:
    title_keyword: NBA
    post_only_ticks: 1
    list_params:
      page_size: 30
      sort_by: 24hr_volume

  own_volume_limit:
    partial_max_budget_raw: "5000000"

  esports_props:
    params:
      page: 1
      page_size: 20
      market_filter: all
      sort_by: volume_24h

  btc_1h:
    series_slug: btc-up-or-down-hourly
    detail:
      asset: BTC
      cadence: 1h
      archetype: up-or-down
    min_markets: 1
    outcome_labels: [Up, Down]

  xrp_daily_hit_price:
    series_slug: xrp-hit-price-daily
    detail:
      asset: XRP
      cadence: daily
      archetype: hit-price
      detail_template: crypto_loop_ladder
    min_markets: 2
    outcome_labels: ["Yes", "No"]

  # 普通二元、多元非互斥和盘口共用的列表选样参数
  ordinary_binary:
    list_params: &market_selection
      page_size: 30
      sort_by: top_picks

  non_exclusive_multi:
    list_params: *market_selection
    min_markets: 2
    outcome_labels: ["Yes", "No"]

  sports_match_blocks:
    list_params:
      page: 1
      page_size: 20
    detail_params:
      layout: blocks
      blocks_version: 1
      lang: en-US

  # orderbook：盘口与购买力
  orderbook_binary:
    list_params: *market_selection
    depth_source: orderbook

  # 市场详情内的持仓与挂单查询
  market_account:
    page: 1
    page_size: 100
    order_type: limit

  # position：账户持仓
  open_positions:
    params:
      state: open
      source: all
      page: 1
      page_size: 20

  closed_positions:
    params:
      source: all
      page: 1
      page_size: 20

  # limit_order：账户订单历史
  order_history:
    params:
      view: history
      source: all
      page_size: 20
    terminal_statuses: [filled, cancelled, canceled, expired, completed, failed, rejected]
