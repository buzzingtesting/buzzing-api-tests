name: Buzzing API scenarios

on:
  schedule:
    - cron: '0 18 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      environment:
        description: API environment
        type: choice
        options:
          - preview
          - prod
        default: preview
      access_only:
        description: Production API access only (clear for M06 Rewards)
        type: boolean
        default: true
      suite:
        description: Scenario suite to run after login
        type: choice
        options:
          - regression
          - m06_rewards
        default: regression
      m06_operation:
        description: M06 operation (grant issues test Credit in Preview)
        type: choice
        options:
          - inspect
          - prepare
          - grant
          - reset
        default: inspect
      m06_case:
        description: M06 date-tool task for prepare or grant
        type: choice
        options:
          - friends
          - daily
        default: friends
      m06_scene_version:
        description: Expected active Preview M06 scene version (optional)
        type: string
        required: false
      m06_resume_run:
        description: Previous GitHub Actions run ID containing the M06 journal (optional)
        type: string
        required: false
      dispute_market_id:
        description: Preview only — run the dispute regression for this market ID
        type: string
        required: false
      dispute_no_position_market_id:
        description: Preview only — market where the CI account has no position
        type: string
        required: false
      disputed_market_id:
        description: Preview only — market already in dispute for the entry eligibility check
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: buzzing-${{ inputs.environment || 'preview' }}
  cancel-in-progress: false

jobs:
  scenarios:
    if: ${{ inputs.suite != 'm06_rewards' && !inputs.m06_resume_run }}
    uses: ./.github/workflows/run-scenarios.yml
    with:
      environment: ${{ inputs.environment || 'preview' }}
      access_only: ${{ inputs.access_only == true }}
      dispute_market_id: ${{ inputs.dispute_market_id || '' }}
      dispute_no_position_market_id: ${{ inputs.dispute_no_position_market_id || '' }}
      disputed_market_id: ${{ inputs.disputed_market_id || '' }}
    secrets: inherit

  retry:
    name: Preview retry
    needs: scenarios
    if: >-
      ${{ !cancelled() && github.run_attempt == '1' &&
          (inputs.environment || 'preview') == 'preview' &&
          !inputs.dispute_market_id && !inputs.dispute_no_position_market_id && !inputs.disputed_market_id &&
          needs.scenarios.outputs.retry_cases != '' }}
    uses: ./.github/workflows/run-scenarios.yml
    with:
      environment: preview
      retry: true
      retry_cases: ${{ needs.scenarios.outputs.retry_cases }}
    secrets: inherit

  m06_rewards:
    name: Preview M06 Rewards
    needs: [scenarios, retry]
    if: >-
      ${{ !cancelled() && (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && (inputs.suite == 'm06_rewards' || inputs.m06_resume_run))) }}
    runs-on: ${{ vars.BUZZING_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      BUZZING_ENV: ${{ github.event_name == 'schedule' && 'preview' || inputs.environment || 'preview' }}
    steps:
      - name: Verify M06 selection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          M06_SUITE: ${{ inputs.suite }}
          M06_ACCESS_ONLY: ${{ inputs.access_only }}
          M06_OPERATION: ${{ inputs.m06_operation }}
          M06_SCENE_VERSION: ${{ inputs.m06_scene_version }}
          M06_RESUME_RUN: ${{ inputs.m06_resume_run }}
          DISPUTE_MARKET_ID: ${{ inputs.dispute_market_id }}
          DISPUTE_NO_POSITION_MARKET_ID: ${{ inputs.dispute_no_position_market_id }}
          DISPUTED_MARKET_ID: ${{ inputs.disputed_market_id }}
        run: |
          if [[ "$M06_SUITE" != m06_rewards || "$BUZZING_ENV" != preview || "$M06_ACCESS_ONLY" == true ]]; then
            echo '::error::M06 Rewards requires Preview and login mode (clear access_only).'
            exit 1
          fi
          if [[ -n "$DISPUTE_MARKET_ID$DISPUTE_NO_POSITION_MARKET_ID$DISPUTED_MARKET_ID" ]]; then
            echo '::error::Leave the dispute market inputs blank when running M06 Rewards.'
            exit 1
          fi
          if [[ "$M06_OPERATION" != inspect && "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo '::error::Start a new workflow dispatch with m06_resume_run pointing to the saved journal.'
            exit 1
          fi
          if [[ "$M06_OPERATION" == reset && -z "$M06_RESUME_RUN" ]]; then
            echo '::error::Reset requires the Actions run ID with the completed Rewards journal.'
            exit 1
          fi
          if [[ -n "$M06_RESUME_RUN" ]]; then
            if [[ ! "$M06_RESUME_RUN" =~ ^[1-9][0-9]*$ || "$M06_OPERATION" == inspect || -n "$M06_SCENE_VERSION" ]]; then
              echo '::error::Resume requires a numeric Actions run ID, a write operation, and a blank scene version.'
              exit 1
            fi
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        id: m06_dependencies
        run: python -m pip install -r requirements.txt
      - name: Run scheduled M06 offline tests
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest offline_tests -q -p no:cacheprovider --junitxml=reports/m06-offline-junit.xml 2>&1 | tee reports/m06-offline.log
      - name: Initialize scheduled M06 login cache
        id: m06_scheduled_cache
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.m06_dependencies.outcome == 'success' }}
        shell: bash
        run: |
          cache_dir="$(mktemp -d "$RUNNER_TEMP/buzzing-auth-XXXXXX")"
          printf 'BUZZING_AUTH_CACHE_DIR=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - name: Restore this scheduled run's journal
        id: m06_scheduled_restore
        if: ${{ !cancelled() && github.event_name == 'schedule' && github.run_attempt != '1' && steps.m06_scheduled_cache.outcome == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: m06-date-test-scheduled-*
          path: reports/m06-restore
      - name: Prepare the scheduled daily reward
        id: m06_scheduled_prepare
        if: ${{ !cancelled() && github.event_name == 'schedule' && github.run_attempt == '1' && steps.m06_scheduled_cache.outcome == 'success' }}
        shell: bash
        env:
          BUZZING_GMAIL_APP_PASSWORD: ${{ secrets.BUZZING_GMAIL_APP_PASSWORD }}
          BUZZING_REWARDS_ADMIN_TOKEN: ${{ secrets.BUZZING_REWARDS_ADMIN_TOKEN }}
        run: |
          mkdir -p reports
          run_id="$(python -c 'from uuid import uuid4; print(uuid4())')"
          python -m pytest testcase/rewards -q -s -p no:cacheprovider --tb=short --no-showlocals \
            --m06-operation prepare --m06-case daily --m06-run-id "$run_id" --m06-journal reports/m06-date-test \
            --junitxml=reports/m06-prepare-junit.xml 2>&1 | tee reports/m06-prepare.log
      - name: Save scheduled journal before granting Credit
        id: m06_scheduled_checkpoint
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.m06_scheduled_prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: m06-date-test-scheduled-prepared
          path: reports/m06-date-test/
          if-no-files-found: error
      - name: Grant scheduled Credit and reconcile the batch and notification
        id: m06_scheduled_grant
        if: >-
          ${{ !cancelled() && github.event_name == 'schedule' &&
              (steps.m06_scheduled_checkpoint.outcome == 'success' || steps.m06_scheduled_restore.outcome == 'success') }}
        shell: bash
        env:
          BUZZING_GMAIL_APP_PASSWORD: ${{ secrets.BUZZING_GMAIL_APP_PASSWORD }}
          BUZZING_REWARDS_ADMIN_TOKEN: ${{ secrets.BUZZING_REWARDS_ADMIN_TOKEN }}
        run: |
          journal=reports/m06-date-test
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            python - <<'PY'
          import json
          from pathlib import Path

          restored = Path("reports/m06-restore")
          prefix = "m06-date-test-scheduled-"
          # The action extracts a single matching artifact directly into its target directory.
          journals = [((-1, 0), restored)] if len(list(restored.glob("*/case.json"))) == 1 else []
          for candidate in restored.glob(f"{prefix}*"):
              suffix = candidate.name.removeprefix(prefix)
              attempt = suffix.removeprefix("reconciled-")
              if suffix == "prepared":
                  rank = (0, 0)
              elif attempt.isascii() and attempt.isdecimal():
                  rank = (int(attempt), 2 if suffix == attempt else 1)
              else:
                  continue
              if len(list(candidate.glob("*/case.json"))) == 1:
                  journals.append((rank, candidate))
          if not journals:
              raise SystemExit("No valid M06 journal from this scheduled run. No grant was attempted by this retry.")
          _, latest = max(journals)
          case = json.loads(next(latest.glob("*/case.json")).read_text(encoding="utf-8"))
          if case.get("scenario") != "daily":
              raise SystemExit("This scheduled run can only resume the daily Rewards case.")
          latest.rename("reports/m06-date-test")
          PY
          fi
          python -m pytest testcase/rewards -q -s -p no:cacheprovider --tb=short --no-showlocals \
            --m06-operation grant --m06-resume --m06-journal "$journal" \
            --junitxml=reports/m06-grant-junit.xml 2>&1 | tee reports/m06-grant.log
      - name: Save reconciled scheduled payout before closing its scene
        id: m06_scheduled_reconciled
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.m06_scheduled_grant.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: m06-date-test-scheduled-reconciled-${{ github.run_attempt }}
          path: reports/m06-date-test/
          if-no-files-found: error
      - name: Close the reconciled scheduled scene and confirm Credit remains
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.m06_scheduled_reconciled.outcome == 'success' }}
        shell: bash
        env:
          BUZZING_GMAIL_APP_PASSWORD: ${{ secrets.BUZZING_GMAIL_APP_PASSWORD }}
          BUZZING_REWARDS_ADMIN_TOKEN: ${{ secrets.BUZZING_REWARDS_ADMIN_TOKEN }}
        run: |
          python -m pytest testcase/rewards -q -s -p no:cacheprovider --tb=short --no-showlocals \
            --m06-operation reset --m06-resume --m06-journal reports/m06-date-test \
            --junitxml=reports/m06-reset-junit.xml 2>&1 | tee reports/m06-reset.log
      - name: Upload scheduled M06 journal
        if: ${{ always() && github.event_name == 'schedule' && hashFiles('reports/m06-date-test/*/case.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: m06-date-test-scheduled-${{ github.run_attempt }}
          path: reports/m06-date-test/
          if-no-files-found: error
      - name: Read scheduled M06 Rewards snapshot
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.m06_scheduled_cache.outcome == 'success' }}
        shell: bash
        env:
          BUZZING_GMAIL_APP_PASSWORD: ${{ secrets.BUZZING_GMAIL_APP_PASSWORD }}
        run: |
          mkdir -p reports
          python -m pytest testcase/rewards -q -s -p no:cacheprovider --tb=short --no-showlocals \
            --m06-operation snapshot --m06-report reports/m06-rewards.json \
            --junitxml=reports/m06-preview-junit.xml 2>&1 | tee reports/m06-rewards.log
      - name: Remove scheduled M06 login cache
        if: ${{ always() && github.event_name == 'schedule' && steps.m06_scheduled_cache.outcome == 'success' }}
        shell: bash
        run: rm -rf -- "$BUZZING_AUTH_CACHE_DIR"
      - name: Check API access
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          mkdir -p reports
          python -m function.preview_access 2>&1 | tee reports/api-access.log
      - name: Verify M06 journal source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.m06_resume_run != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          M06_RESUME_RUN: ${{ inputs.m06_resume_run }}
        run: |
          curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$M06_RESUME_RUN" |
            python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          workflow_path = os.environ["GITHUB_WORKFLOW_REF"].split("@", 1)[0].split("/", 2)[2]
          if (run["status"] != "completed" or run["event"] != "workflow_dispatch"
                  or run["path"].split("@", 1)[0] != workflow_path
                  or run["head_repository"]["full_name"] != os.environ["GITHUB_REPOSITORY"]
                  or os.environ["GITHUB_REF_TYPE"] != "branch"
                  or run["head_branch"] != os.environ["GITHUB_REF_NAME"]):
              sys.exit("Resume requires a completed manual run of this workflow on the same branch and repository.")
          '
      - name: Restore M06 journal
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.m06_resume_run != '' }}
        uses: actions/download-artifact@v8
        with:
          name: m06-date-test
          path: reports/m06-date-test
          github-token: ${{ github.token }}
          run-id: ${{ inputs.m06_resume_run }}
      - name: Check M06 Rewards with the tester1 session
        id: m06_rewards
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          BUZZING_GMAIL_APP_PASSWORD: ${{ secrets.BUZZING_GMAIL_APP_PASSWORD }}
          BUZZING_REWARDS_ADMIN_TOKEN: ${{ inputs.m06_operation != 'inspect' && secrets.BUZZING_REWARDS_ADMIN_TOKEN || '' }}
          M06_OPERATION: ${{ inputs.m06_operation || 'inspect' }}
          M06_CASE: ${{ inputs.m06_case || 'friends' }}
          M06_SCENE_VERSION: ${{ inputs.m06_scene_version }}
          M06_RESUME_RUN: ${{ inputs.m06_resume_run }}
        run: |
          cache_dir="$(mktemp -d "$RUNNER_TEMP/buzzing-auth-XXXXXX")"
          trap 'rm -rf -- "$cache_dir"' EXIT
          export BUZZING_AUTH_CACHE_DIR="$cache_dir"
          args=(--m06-operation "$M06_OPERATION")
          if [[ "$M06_OPERATION" == inspect ]]; then
            args+=(--m06-report reports/m06-rewards.json)
          else
            args+=(--m06-journal reports/m06-date-test)
            if [[ -n "$M06_RESUME_RUN" ]]; then
              args+=(--m06-resume)
            else
              args+=(--m06-case "$M06_CASE" --m06-run-id "$(python -c 'from uuid import uuid4; print(uuid4())')")
            fi
          fi
          if [[ -n "$M06_SCENE_VERSION" ]]; then
            args+=(--m06-scene-version "$M06_SCENE_VERSION")
          fi
          python -m pytest testcase/rewards -q -s --tb=short --no-showlocals "${args[@]}" 2>&1 | tee reports/m06-rewards.log
      - name: Upload M06 journal for continuation
        if: ${{ always() && github.event_name == 'workflow_dispatch' && steps.m06_rewards.outcome != 'skipped' && hashFiles('reports/m06-date-test/*/case.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: m06-date-test
          path: reports/m06-date-test/
          if-no-files-found: error
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ github.event_name == 'schedule' && format('preview-m06-rewards{0}', github.run_attempt != '1' && format('-attempt-{0}', github.run_attempt) || '')
                || format('{0}-scenarios', env.BUZZING_ENV) }}
          path: |
            reports/api-access.log
            reports/m06-rewards.json
            reports/m06-*.log
            reports/m06-*-junit.xml
