name: Buzzing API scenarios

on:
  schedule:
    - cron: '0 18 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      environment:
        description: API environment
        type: choice
        options:
          - preview
          - prod
        default: preview
      access_only:
        description: Production only — verify API access without running scenarios
        type: boolean
        default: true
      dispute_market_id:
        description: Preview only — run the dispute regression for this market ID
        type: string
        required: false
      dispute_no_position_market_id:
        description: Preview only — market where the CI account has no position
        type: string
        required: false
      disputed_market_id:
        description: Preview only — market already in dispute for the entry eligibility check
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: buzzing-${{ inputs.environment || 'preview' }}
  cancel-in-progress: false

jobs:
  scenarios:
    uses: ./.github/workflows/run-scenarios.yml
    with:
      environment: ${{ inputs.environment || 'preview' }}
      access_only: ${{ inputs.access_only == true }}
      dispute_market_id: ${{ inputs.dispute_market_id || '' }}
      dispute_no_position_market_id: ${{ inputs.dispute_no_position_market_id || '' }}
      disputed_market_id: ${{ inputs.disputed_market_id || '' }}
    secrets: inherit

  retry:
    name: Preview retry
    needs: scenarios
    if: >-
      ${{ !cancelled() && github.run_attempt == '1' &&
          (inputs.environment || 'preview') == 'preview' &&
          !inputs.dispute_market_id && !inputs.dispute_no_position_market_id && !inputs.disputed_market_id &&
          needs.scenarios.outputs.retry_cases != '' }}
    uses: ./.github/workflows/run-scenarios.yml
    with:
      environment: preview
      retry: true
      retry_cases: ${{ needs.scenarios.outputs.retry_cases }}
    secrets: inherit
