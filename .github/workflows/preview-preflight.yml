name: Preview API preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run Preview preflight
        run: sh scripts/run_preflight.sh
      - name: Save logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-preflight
          path: reports/preflight-*/
