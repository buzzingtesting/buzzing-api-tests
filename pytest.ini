[pytest]
testpaths = testcase
pythonpath = .
addopts = --log-disable=httpx
markers=
    multiprocess: 可以多进程跑
    singleProcess: 一个个跑
    pro: 可以在生产环境上跑的用例
    manual_dispute(scenario): 支持手动指定 Preview 市场，争议中资格用例也会在日常 Preview 自动选样
    b3_fixture: Preview 专用数据用例，在日常交易场景后串行执行
    m03_case(scenario): 有对应运行配置时才执行的 Preview 受控交易场景
    trade_followup: 依赖同一轮已确认的原始买单
# 解决ids中文编码问题
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
